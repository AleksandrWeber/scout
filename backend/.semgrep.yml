rules:
  - id: scout.react-dangerously-set-innerhtml
    patterns:
      - pattern: dangerouslySetInnerHTML=$VALUE
    message: "React dangerouslySetInnerHTML may expose the app to XSS."
    languages: [javascript, javascript.react]
    severity: ERROR
    metadata:
      category: XSS
      severity: HIGH
      fix: "Avoid dangerouslySetInnerHTML and use safe JSX rendering or sanitize values before use."
      education: "dangerouslySetInnerHTML bypasses React escaping and can execute attacker-controlled HTML."

  - id: scout.dom-innerhtml-assignment
    patterns:
      - pattern: $OBJ.innerHTML = $VALUE
    message: "Assigning to innerHTML may introduce XSS when the value contains untrusted content."
    languages: [javascript, javascript.react]
    severity: ERROR
    metadata:
      category: XSS
      severity: HIGH
      fix: "Use textContent, createElement, or sanitize the HTML before assignment."
      education: "innerHTML inserts raw HTML into the DOM without escaping user content."

  - id: scout.js-eval
    pattern: eval($EXPR)
    message: "eval() executes code from a string and may allow remote code execution."
    languages: [javascript, javascript.react]
    severity: ERROR
    metadata:
      category: CODE_INJECTION
      severity: HIGH
      fix: "Remove eval() and replace it with explicit parsing or safer alternatives."
      education: "eval executes dynamic strings as JavaScript code, which is extremely dangerous."

  - id: scout.dom-write
    pattern: document.write($CONTENT)
    message: "document.write can inject unsafe HTML into the page."
    languages: [javascript, javascript.react]
    severity: WARNING
    metadata:
      category: CODE_INJECTION
      severity: MEDIUM
      fix: "Avoid document.write and use DOM APIs or sanitized content insertion."
      education: "document.write writes raw HTML to the document at runtime and can introduce XSS."

  - id: scout.new-function
    pattern: new Function($ARGS)
    message: "new Function() executes a string as code and is equivalent to eval()."
    languages: [javascript, javascript.react]
    severity: ERROR
    metadata:
      category: CODE_INJECTION
      severity: HIGH
      fix: "Avoid dynamic code generation and use explicit functions or parsed data structures."
      education: "new Function constructs and executes code from a string, which is dangerous."
