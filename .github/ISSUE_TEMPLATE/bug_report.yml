name: Bug report
description: Report a bug or unexpected behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include API keys, tokens, or private repository URLs with credentials.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List commands or UI steps that reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Branch or commit
      placeholder: main / commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant logs, screenshots, or CI links.
