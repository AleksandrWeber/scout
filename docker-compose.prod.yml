services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: "4000"
      NODE_ENV: production
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
