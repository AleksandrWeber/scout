services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: "4000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/.semgrep.yml:/app/backend/.semgrep.yml
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
