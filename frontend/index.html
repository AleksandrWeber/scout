<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scout</title>
    <style>
      html[data-theme='dark'] body {
        background: #0f172a;
        color: #f1f5f9;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('scout-theme');
          if (theme === 'dark') {
            document.documentElement.dataset.theme = 'dark';
          }

          var locale = localStorage.getItem('scout-locale');
          if (locale === 'uk') {
            document.documentElement.lang = 'uk';
          }
        } catch (error) {
          // Ignore storage errors on first paint.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
